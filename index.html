<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nakonechnik</title>
  <meta name="description" content="Nakonechnik — сервер Terraria с мини-играми." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sky__glow sky__glow--a"></div>
    <div class="sky__glow sky__glow--b"></div>
    <div class="sky__grid"></div>
  </div>

  <header class="hero">
    <h1 class="hero__brand">Nakonechnik</h1>
    <p class="hero__lead">Сервер террарии с минииграми</p>

    <p class="hero__addr">
      Адрес сервера:
      <button type="button" class="copy" id="copy-host" title="Скопировать">
        <span id="host-label">play.nakonechnik.fun:7777</span>
      </button>
    </p>

    <div class="hero__actions">
      <a class="btn btn--ghost" id="link-tg" href="https://t.me/terraria_nakonechnik" target="_blank" rel="noopener noreferrer">Telegram</a>
      <a class="btn btn--ghost" id="link-donate" href="https://www.donationalerts.com/r/nakonechnik_off" target="_blank" rel="noopener noreferrer">Поддержать</a>
    </div>
  </header>

  <main>
    <section class="block" id="projects">
      <h2>Другие наши проекты</h2>
      <ul class="projects">
        <li class="projects__item projects__item--stub">
          <span class="projects__name">Скоро</span>
          <span class="projects__hint">заглушка</span>
        </li>
        <li class="projects__item projects__item--stub">
          <span class="projects__name">Скоро</span>
          <span class="projects__hint">заглушка</span>
        </li>
        <li class="projects__item projects__item--stub">
          <span class="projects__name">Скоро</span>
          <span class="projects__hint">заглушка</span>
        </li>
      </ul>
    </section>
  </main>

  <footer class="foot">
    <p>© <span id="year"></span> Nakonechnik</p>
  </footer>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
